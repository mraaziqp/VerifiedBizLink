# Scheduled jobs for the deployed app.
#
# The app is deployed on AWS Amplify, which has no built-in scheduler, so
# GitHub Actions calls the app's /api/cron/* routes on a timer.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CRON_SECRET  - must be identical to CRON_SECRET in AWS Amplify's
#                  environment variables
#   APP_URL      - https://www.verifiedbizlink.co.za (a bare domain or a
#                  trailing slash also works)
#
# Every failure leaves a one-line reason as an annotation on the run:
# missing GitHub secret, app has no CRON_SECRET (503), or the two secrets
# differ (401). See .github/scripts/run-cron.sh.

name: Scheduled jobs

on:
  schedule:
    # Hourly. The billing sweeps are time-based rather than run-based, so a
    # missed or delayed run only means a late decision, never a wrong one.
    - cron: '7 * * * *'
    # Once a day, 07:00 UTC = 09:00 SAST.
    - cron: '0 7 * * *'
  workflow_dispatch:

env:
  APP_URL: ${{ secrets.APP_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  billing:
    name: Subscription billing sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Sweep subscriptions (warnings, 3-day downgrade to Free)
        run: bash .github/scripts/run-cron.sh billing "Subscription billing sweep" --check-errors

  pos-billing:
    name: POS subscription & fee-statement sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Sweep POS billing
        run: bash .github/scripts/run-cron.sh pos-billing "POS billing sweep"

  abandoned-signups:
    name: Chase abandoned signups
    runs-on: ubuntu-latest
    # Hourly: each run sends what fits in its time budget and the next run
    # carries on. Everyone is emailed at most once, ever.
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Send abandoned-signup reminders
        run: bash .github/scripts/run-cron.sh abandoned-signups "Abandoned signups"

  studio-credits:
    name: Monthly Build Studio credit
    runs-on: ubuntu-latest
    # Daily: the grants are keyed by month, so only the first run each month gives anything.
    if: github.event.schedule == '0 7 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Give this month's studio credit
        run: bash .github/scripts/run-cron.sh studio-credits "Build Studio credit" --check-errors
