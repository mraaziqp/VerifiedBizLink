name: Build Android App (APK)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Sync Android platform
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (Debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build APK (Release)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Check APKs
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          ls -lh android/app/build/outputs/apk/release/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VerifiedBizLink-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VerifiedBizLink-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Create Release (on main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: android-build-${{ github.run_number }}
          release_name: Android Build ${{ github.run_number }}
          body: |
            ## VerifiedBizLink Android Build

            **Date:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref }}

            ### Build Details
            - **Status:** ✅ Success
            - **Runner:** Ubuntu Latest
            - **Java:** Temurin 17
            - **Build Type:** Release (unsigned)
            - **APK Size:** ~9.4 MB

            ### Download
            - **Release APK:** app-release-unsigned.apk (Production)
            - **Debug APK:** app-debug.apk (Testing)

            ### Installation
            ```bash
            # Using ADB
            adb install android/app/build/outputs/apk/release/app-release-unsigned.apk

            # Or manually:
            1. Enable "Unknown Sources" in Android Settings
            2. Transfer APK to phone
            3. Tap to install
            4. Launch app
            ```

            ### Features Included
            - ✅ Real-time commodity prices (13 commodities)
            - ✅ Market news and analysis
            - ✅ Price comparator tool (compare up to 5)
            - ✅ Market statistics (gainers/losers)
            - ✅ Watchlist management with persistence
            - ✅ All admin dashboards
            - ✅ Settings portal (5 pages)
            - ✅ User management
            - ✅ Compliance tracking
            - ✅ Audit logging
            - ✅ Real-time monitoring

            ### For Production Release
            To release on Google Play Store:
            1. Sign the APK with your release key
            2. Upload to Google Play Console
            3. Fill app details and screenshots
            4. Submit for review

            See MOBILE_APP.md for signing instructions.
          draft: false
          prerelease: false

  notify:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Build status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Android build completed successfully!"
            echo "📦 APK files available in Artifacts"
            echo "📱 Ready for distribution"
            echo ""
            echo "Files:"
            echo "- app-debug.apk (for testing)"
            echo "- app-release-unsigned.apk (for production)"
          else
            echo "❌ Android build failed"
            echo "Check the build logs above for details"
          fi
