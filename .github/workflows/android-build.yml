name: Build Android App (APK)

# The app is a native shell around the live site (capacitor.config.ts
# server.url) plus a bundled offline page, so only native/config changes
# need a new APK — web changes reach the app on the next launch.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'public/offline.html'
      - 'public/icon-*.png'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'public/offline.html'
      - 'public/icon-*.png'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      # Optional. Set both in Settings → Secrets → Actions to publish builds
      # to the admin dashboard (private "app-builds" bucket).
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Optional, for a signed release APK (Play Store): base64 of the .jks.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      # Same debug key every run, so a new test build installs as an update
      # over the last one instead of "App not installed" (signature mismatch).
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vbl-android-debug-keystore-v1

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # No `next build`: nothing from it goes into the APK. Sync copies
      # public/ (offline page, icons) and the Capacitor config.
      - name: Sync Android platform
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PvblVersionCode=$VERSION_CODE -PvblVersionName=$VERSION_NAME

      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          VBL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VBL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VBL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          VBL_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease --no-daemon -PvblVersionCode=$VERSION_CODE -PvblVersionName=$VERSION_NAME
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Name the APKs
        id: apk
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/VerifiedBizLink-$VERSION_NAME-$SHA-test.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/VerifiedBizLink-$VERSION_NAME-$SHA-release.apk"
          fi
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VerifiedBizLink-APK-${{ env.VERSION_NAME }}
          path: out/*.apk
          retention-days: 30

      # Only builds from main or a manual run go to the admin dashboard, and
      # only to a private bucket: nothing is public until you choose to be.
      - name: Publish to admin dashboard
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: |
          set -euo pipefail
          API="${SUPABASE_URL%/}/storage/v1"
          AUTH=(-H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY")
          # Create the private bucket once (409 = already exists).
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$API/bucket" "${AUTH[@]}" \
            -H 'Content-Type: application/json' -d '{"id":"app-builds","name":"app-builds","public":false}')
          echo "bucket: HTTP $code"
          for f in out/*.apk; do
            name=$(basename "$f")
            code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST "$API/object/app-builds/builds/$name" "${AUTH[@]}" \
              -H 'Content-Type: application/vnd.android.package-archive' -H 'x-upsert: true' --data-binary @"$f")
            echo "$name: HTTP $code"
            if [ "$code" != "200" ]; then cat /tmp/resp.txt; exit 1; fi
          done
