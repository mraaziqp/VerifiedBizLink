name: Build iOS App (IPA)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Sync iOS platform
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: |
          pod install

      - name: Build iOS archive
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -derivedDataPath build \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            archive

      - name: Export IPA
        working-directory: ios/App
        run: |
          # Create export options plist
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>method</key>
              <string>ad-hoc</string>
              <key>teamID</key>
              <string></string>
          </dict>
          </plist>
          EOF

          # Export the archive
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates

      - name: Check IPA
        working-directory: ios/App
        run: |
          ls -lh build/output/
          file build/output/*.ipa || echo "IPA not found yet"

      - name: Rename IPA
        working-directory: ios/App
        run: |
          if [ -f build/output/App.ipa ]; then
            cp build/output/App.ipa build/output/VerifiedBizLink.ipa
          fi

      - name: Upload IPA to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VerifiedBizLink-iOS
          path: |
            ios/App/build/output/VerifiedBizLink.ipa
            ios/App/build/output/App.ipa
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ios-build-${{ github.run_number }}
          release_name: iOS Build ${{ github.run_number }}
          body: |
            ## VerifiedBizLink iOS Build

            **Date:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref }}

            ### Build Details
            - **Status:** ✅ Success
            - **Runner:** macOS Latest
            - **Xcode:** Latest Stable
            - **Build Type:** Ad-hoc Distribution

            ### Download
            Download the IPA from the Artifacts section.

            ### Installation
            1. Download the IPA file
            2. Use Transporter app (Mac App Store)
            3. Or use TestFlight for beta testing
            4. Or install directly on device via Xcode

            ### Features Included
            - ✅ Real-time commodity prices
            - ✅ Market news and analysis
            - ✅ Price comparator tool
            - ✅ Watchlist management
            - ✅ All admin dashboards
            - ✅ Settings portal
            - ✅ User management
            - ✅ Compliance tracking
          draft: false
          prerelease: false

  notify:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Build status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ iOS build completed successfully!"
            echo "📦 IPA file available in Artifacts"
            echo "📱 Ready for TestFlight or distribution"
          else
            echo "❌ iOS build failed"
            echo "Check the build logs above for details"
          fi
