name: Build iOS App (compile check)

# The iOS project uses Capacitor's Swift Package Manager setup
# (ios/App/CapApp-SPM), so there is no Podfile and no .xcworkspace; the old
# `pod install` + `-workspace` steps failed on every run. This builds the
# project for a generic iOS device with code signing off, which proves the
# native project compiles. Producing an installable IPA additionally needs an
# Apple Developer team, certificate and provisioning profile as repo secrets.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'public/offline.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'public/offline.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # The app loads the live site (capacitor.config.ts server.url); only the
      # static files in public/ (offline page, icons) are bundled.
      - name: Sync iOS platform
        run: npx cap sync ios

      - name: Build (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -list -project App.xcodeproj
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
